# À chaque modification publiée : tous les tests. En cas d'échec, GitHub envoie un email.
name: Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install --no-save --no-package-lock jsdom
      - name: Fichiers des robots valides (YAML)
        run: |
          pip install pyyaml
          python -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]"
      - run: node tools/test_site.mjs
      - run: node tools/test_nouveaux.mjs
      - run: node tools/test_sw.mjs
      - run: python tools/test_robot.py
